services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: puttential
      POSTGRES_PASSWORD: puttential
      POSTGRES_DB: puttential
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - puttential-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puttential -d puttential"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  puttential-postgres:
